<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>
  <canvas id="starfield"></canvas>
  <div class="scanlines"></div>

  <button class="menu-toggle" id="menuToggle" aria-label="打开目录">☰</button>

  <header class="hero">
    <canvas id="neuralCanvas"></canvas>
    <div class="corner-deco top-left"></div>
    <div class="corner-deco top-right"></div>
    <div class="corner-deco bottom-left"></div>
    <div class="corner-deco bottom-right"></div>
    <div class="hero-content">
      <div class="robot-avatar" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
            </linearGradient>
            <filter id="robotGlow">
              <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect x="25" y="20" width="50" height="45" rx="10" fill="none" stroke="url(#robotGrad)" stroke-width="2" filter="url(#robotGlow)"/>
          <rect x="30" y="28" width="40" height="20" rx="5" fill="rgba(34,211,238,0.1)" stroke="url(#robotGrad)" stroke-width="1"/>
          <circle cx="38" cy="38" r="4" fill="#22d3ee" filter="url(#robotGlow)">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="62" cy="38" r="4" fill="#22d3ee" filter="url(#robotGlow)">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <line x1="50" y1="48" x2="50" y2="55" stroke="#22d3ee" stroke-width="2" filter="url(#robotGlow)"/>
          <rect x="42" y="55" width="16" height="4" rx="2" fill="#22d3ee" filter="url(#robotGlow)"/>
          <line x1="25" y1="30" x2="15" y2="20" stroke="#22d3ee" stroke-width="2" filter="url(#robotGlow)"/>
          <circle cx="15" cy="20" r="3" fill="#22d3ee" filter="url(#robotGlow)"/>
          <line x1="75" y1="30" x2="85" y2="20" stroke="#22d3ee" stroke-width="2" filter="url(#robotGlow)"/>
          <circle cx="85" cy="20" r="3" fill="#22d3ee" filter="url(#robotGlow)"/>
          <rect x="35" y="65" width="8" height="15" rx="2" fill="none" stroke="url(#robotGrad)" stroke-width="1.5" filter="url(#robotGlow)"/>
          <rect x="57" y="65" width="8" height="15" rx="2" fill="none" stroke="url(#robotGrad)" stroke-width="1.5" filter="url(#robotGlow)"/>
          <path d="M35 80 L25 92 M65 80 L75 92" stroke="#22d3ee" stroke-width="1.5" filter="url(#robotGlow)"/>
          <circle cx="20" cy="70" r="2" fill="#a855f7" filter="url(#robotGlow)">
            <animate attributeName="cy" values="70;75;70" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="80" cy="75" r="2" fill="#a855f7" filter="url(#robotGlow)">
            <animate attributeName="cy" values="75;70;75" dur="3s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <h1 data-text="Learning-line-of-AI">Learning-line-of-AI</h1>
      <p class="subtitle">人工智能学习路线 · 从数学基础到前沿论文的系统性知识图谱</p>
      <div class="badge">AI Learning Roadmap</div>
    </div>
  </header>

  <div class="main">
    <nav class="sidebar" id="sidebar">
      <div class="toc-title">目录导航</div>
      <ul class="toc" id="toc"></ul>
    </nav>
    <main class="content">

        <div class="markdown-body" id="content">
          <div class="status" id="status"><span class="spinner"></span>正在加载 README.md ...</div>
        </div>

    </main>
  </div>

  <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

  <script src="index/marked.min.js"></script>
  <script src="index/app.js"></script>
</body>
</html>
